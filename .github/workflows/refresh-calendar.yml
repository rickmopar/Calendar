name: Refresh calendar data

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Refresh source data
        run: node scripts/refresh-events.js

      - name: Rebuild standalone file
        run: node scripts/build-standalone.js

      - name: Commit updated calendar data
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "Refresh calendar data"
          file_pattern: "data/*.json data/*.js raw/* car-show-calendar.html"
