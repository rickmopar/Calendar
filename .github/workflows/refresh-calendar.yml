name: Refresh calendar data

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh source data
        run: node scripts/refresh-events.js

      - name: Rebuild standalone file
        run: node scripts/build-standalone.js

      - name: Commit updated calendar data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh calendar data"
          file_pattern: "data/*.json data/*.js raw/* car-show-calendar.html"
